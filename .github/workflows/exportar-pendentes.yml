name: Exportar assinaturas pendentes (ZapSign)
on:
  workflow_dispatch:
    inputs:
      chave:
        description: 'Chave para criptografar a saída'
        required: true
jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - run: echo "::add-mask::${{ github.event.inputs.chave }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/exportar-pendentes-zapsign.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Saída criptografada (só quem tem a chave lê)
        env: { CHAVE: '${{ github.event.inputs.chave }}' }
        run: |
          gzip -c saida/pendentes.json | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:CHAVE | base64 -w0 > saida/p.b64
          echo "INICIO_DADOS"; fold -w 3000 saida/p.b64 | sed "s/^/D:/"; echo; echo "FIM_DADOS"
