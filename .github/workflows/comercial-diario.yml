name: Comercial — fim do dia (números para a IA)
on:
  schedule:
    - cron: '20 21 * * 1-5'   # 18h20 (Brasília), seg a sex
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: comercial-diario, cancel-in-progress: false }
jobs:
  comercial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/comercial-diario.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          META_EQUIPE_DIA: ${{ vars.META_EQUIPE_DIA || '3' }}
      - name: Salvar números do dia (sem dados de clientes)
        run: |
          git config user.name "comercial-diario"
          git config user.email "comercial-diario@users.noreply.github.com"
          git add dados/comercial
          git commit -m "Comercial: números de $(date -u +%F) [skip ci]" && git pull --rebase -q && git push || echo "nada novo"
