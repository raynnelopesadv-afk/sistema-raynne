name: Equipe — instalar migração e criar logins
# Só roda manualmente.
#  1) aplica UM arquivo .sql de supabase/migrations pela API da Supabase (as migrações são idempotentes);
#  2) cria/atualiza os logins da equipe (JSON com e-mail, senha, nome, papel, setores).
on:
  workflow_dispatch:
    inputs:
      migracao:
        description: 'Arquivo em supabase/migrations para aplicar (vazio = não aplicar)'
        default: ''
      usuarios:
        description: 'JSON dos logins (vazio = não criar)'
        default: ''
jobs:
  equipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Esconder senhas do log
        if: ${{ github.event.inputs.usuarios != '' }}
        env:
          USUARIOS: ${{ github.event.inputs.usuarios }}
        run: |
          echo "$USUARIOS" | python3 -c "import json,sys; [print('::add-mask::'+u['senha']) for u in json.load(sys.stdin)]"
      - name: Aplicar migração
        if: ${{ github.event.inputs.migracao != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ARQUIVO: ${{ github.event.inputs.migracao }}
        run: |
          f="supabase/migrations/$(basename "$ARQUIVO")"
          test -f "$f" || { echo "Arquivo não encontrado: $f"; exit 1; }
          python3 -c "import json,sys; print(json.dumps({'query': open(sys.argv[1]).read()}))" "$f" > /tmp/q.json
          code=$(curl -sS -o /tmp/r.txt -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @/tmp/q.json)
          echo "HTTP $code"; head -c 600 /tmp/r.txt; echo
          test "$code" -ge 200 -a "$code" -lt 300
      - uses: actions/setup-node@v4
        if: ${{ github.event.inputs.usuarios != '' }}
        with: { node-version: 22, cache: npm }
      - if: ${{ github.event.inputs.usuarios != '' }}
        run: npm ci --no-audit --no-fund
      - name: Criar logins
        if: ${{ github.event.inputs.usuarios != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          USUARIOS: ${{ github.event.inputs.usuarios }}
        run: node scripts/criar-usuarios.mjs
