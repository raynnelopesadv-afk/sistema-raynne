name: ZapSign — contratos e assinaturas pendentes
on:
  schedule:
    - cron: '17 11-23/2 * * *'   # a cada 2 horas, das 08h às 20h (Brasília)
  workflow_dispatch:
    inputs:
      desde:
        description: 'Buscar documentos criados desde (AAAA-MM-DD)'
        default: '2026-01-01'
      listar_sem_area:
        description: 'Listar nomes de arquivos sem área (diagnóstico)'
        default: ''
jobs:
  zapsign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/zapsign.mjs --desde ${{ github.event.inputs.desde || '2026-01-01' }}
        env:
          ZAPSIGN_API_TOKEN: ${{ secrets.ZAPSIGN_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZAPSIGN_IGNORAR: ${{ vars.ZAPSIGN_IGNORAR || 'raynne' }}
          ZAPSIGN_LISTAR_SEM_AREA: ${{ github.event.inputs.listar_sem_area }}
