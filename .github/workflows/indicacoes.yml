name: Comissão por indicação (instalar tabela)
# Instala a tabela de indicações na Supabase quando a migração muda
# (se existir o secret SUPABASE_ACCESS_TOKEN; senão, cole o .sql no SQL Editor).
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261118100000_indicacoes.sql'
      - '.github/workflows/indicacoes.yml'
  workflow_dispatch:
jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar tabela de indicações
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Sem SUPABASE_ACCESS_TOKEN: cole supabase/migrations/20261118100000_indicacoes.sql no SQL Editor da Supabase uma vez."; exit 1; fi
          f="supabase/migrations/20261118100000_indicacoes.sql"
          python3 -c "import json,sys; print(json.dumps({'query': open(sys.argv[1]).read()}))" "$f" > /tmp/q.json
          code=$(curl -sS -o /tmp/r.txt -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @/tmp/q.json)
          echo "HTTP $code"; head -c 600 /tmp/r.txt; echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Instalação: HTTP $code $(head -c 300 /tmp/r.txt | tr '\n' ' ')"; exit 1; fi
          echo "::notice::Tabela de indicações instalada."
