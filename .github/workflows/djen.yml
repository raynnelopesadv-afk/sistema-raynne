name: DJEN — publicações diárias
# O CNJ bloqueia IPs fora do Brasil (os robôs do GitHub ficam nos EUA).
# A busca diária roda DENTRO do banco (São Paulo) via pg_cron — ver
# supabase/migrations/20261108100000_djen_no_banco.sql. Este workflow fica só manual.
on:
  workflow_dispatch:
    inputs:
      dias:
        description: 'Quantos dias para trás buscar'
        default: '5'
jobs:
  djen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/importar.mjs djen --dias ${{ github.event.inputs.dias || '5' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OABS: ${{ vars.OABS || '160914/MG' }}
